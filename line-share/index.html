<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>喬馨課程分享</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="share-panel" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">↗</div>
      <h1 id="page-title">分享課程給好友</h1>
      <p id="status" class="status" role="status" aria-live="polite">正在準備分享內容……</p>
      <button id="share-button" class="share-button" type="button" hidden>選擇好友或群組</button>
      <p class="privacy-note">不會讀取或保存你的好友名單與個人資料。</p>
    </main>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
